name: ci

on:
  pull_request:
  push:
    branches: [main, 'phase-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SHARED_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SHARED_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          NEXT_PUBLIC_APP_VERSION: 0.0.0-ci

  functions:
    name: deno check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/functions

  database:
    name: migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local stack inside the runner only. Applies every migration to an empty database, then the seed.
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - run: pnpm exec supabase test db
      - if: always()
        run: pnpm exec supabase stop --no-backup
